name: E-Raport Auto Deploy CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            if [ ! -d "/home/miomideveloper/e-raport-almusyafallahi/.git" ]; then
              git clone https://github.com/ibayjejeboy-hash/project2.git /home/miomideveloper/e-raport-almusyafallahi
            fi
            git config --global --add safe.directory /home/miomideveloper/e-raport-almusyafallahi
            cd /home/miomideveloper/e-raport-almusyafallahi
            git fetch --all
            git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh
